name: Site checks
on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
      - run: npm ci
      - run: npm run check
      - run: go mod verify
      - run: go vet ./...
      - run: go test ./...
      - run: test -z "$(gofmt -l *.go)"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dev
      - run: npm run test:e2e
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results/
      - name: Build production image
        run: docker build -t portfolio:test .
      - name: Smoke-test production image
        run: |
          docker run -d --name portfolio -p 8080:8080 portfolio:test
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8080/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/ > /dev/null
          curl -fsS http://localhost:8080/cs/projects/lylink/ > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ja/missing)" = 404
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: 1.26.6
          go-package: ./...
